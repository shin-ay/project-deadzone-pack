		#Range: 0.0 ~ 1000.0
		mob_gear_chance_multiplier = 1.0
		#Whether mobs drop the gear given to them by this event.
		mob_drops_event_gear = false
		#Chance multiplier for non-common drops (uncommon, rare, epic) during this event.
		#Range: 1.0 ~ 100.0
		rare_drop_multiplier = 1.0
		#Only mobs spawned by the event are affected by rare_drop_multiplier.
		rare_drop_only_event_mobs = true
		#Multiplier on experience dropped by mobs killed during this event.
		#Range: 0.0 ~ 1000.0
