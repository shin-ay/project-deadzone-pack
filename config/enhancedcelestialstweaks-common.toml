		#Range: -1.0 ~ 10000.0
		mob_cap_multiplier = 1.0
		#Whether this event blocks sleeping.
		#Allowed Values: DEFAULT, TRUE, FALSE
		block_sleeping = "DEFAULT"
		#Use the biome's normal spawn list during this event.
		#Allowed Values: DEFAULT, TRUE, FALSE
		use_biome_spawn_settings = "DEFAULT"
		#Force mobs to spawn on the surface during this event.
		#Allowed Values: DEFAULT, TRUE, FALSE
		force_surface_spawning = "DEFAULT"
		#Allow slimes to spawn anywhere during this event.
		#Allowed Values: DEFAULT, TRUE, FALSE
		slimes_spawn_everywhere = "DEFAULT"
		#Force weather while this event is active. DEFAULT keeps vanilla weather.
		#Allowed Values: DEFAULT, CLEAR, RAIN, THUNDER
		weather_override = "DEFAULT"
		#Allow vanilla weather to return after the event ends.
		restore_weather_after_event = true
		#Per-category spawn multipliers. Format: "CATEGORY:value"
		mob_category_multipliers = ["MONSTER:2.25"]
