
#General settings.
[general]
	#Master toggle for all tweaks.
	enabled = true
	#Log applied tweaks to the console.
	log_tweaks = false
	#Make all events visual-only.
	events_visual_only = false
	#Rebuild the lunar forecast on server start so config changes apply to scheduled events.
	recompute_forecast_on_start = true

#Overworld dimension settings.
[overworld]
	#Whether events require clear skies.
	#Allowed Values: DEFAULT, TRUE, FALSE
	require_clear_skies = "DEFAULT"
	#Minimum days between events. -1 keeps default.
	#Range: -1 ~ 9223372036854775807
	min_days_between_events = -1
	#Maximum days between events. -1 keeps default.
	#Range: -1 ~ 9223372036854775807
	max_days_between_events = -1
	#Day length in ticks. -1 keeps default.
	#Range: -1 ~ 9223372036854775807
	day_length = -1
	#Year length in days. -1 keeps default.
	#Range: -1 ~ 9223372036854775807
	year_length_in_days = -1

#Per-event tweaks. Set chance_multiplier to 0 to disable an event.
[events]

	[events.blood_moon]
		#Multiplier on the event's spawn chance. 0 disables it.
		#Range: 0.0 ~ 1000.0
		chance_multiplier = 1.0
		#Minimum nights between this event. -1 keeps default.
		#Range: > -1
		min_nights_between = -1
		#Moon phases (0-7) this event can occur on. Empty keeps default.
		valid_moon_phases = []
		#Global multiplier applied to every mob category's spawn rate during this event, including categories set by mob_category_multipliers.
		#Range: 0.0 ~ 1000.0
		mob_spawn_multiplier = 1.0
