		spawn_removals = []
		#Dimensions to add this event to. Format: "namespace:dimension_id". Uses overworld settings as template.
		added_dimensions = []
		#Maximum block light level monsters can spawn at during this event. 0 = vanilla.
		#Range: 0 ~ 15
		monster_spawn_light_level = 0
