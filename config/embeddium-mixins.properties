# PDZ shader crash isolation:
# Disable Embeddium's immediate BufferBuilder optimization. Oculus also
# transforms this path, and their overlap has caused repeated buffer-overflow
# crashes across block entities, mobs, mounts, and vehicles.
mixin.features.render.immediate.buffer_builder=false
