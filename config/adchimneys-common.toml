# PROJECT DEADZONE chimney tuning v0.1

[Smoke]
	defaultColor = -1
	maxAmount = 18
	maxIntencity = 4.0
	maxScale = 2.5
	maxRenderDistance = 128
	replaceVanillaCampfireSmoke = true
	# Smoke remains visible, but it does not directly poison anything.
	poisonAnimals = false
	poisonHostileMobs = false
	poisonNPCs = false
	poisonPlayers = false

[Painting]
	"whereAreTheSettings?" = ["I've read the hint and understood"]

[Chimney]
	narrowChimneyLightDampening = 5
	fullSizedChimneyLightDampening = 10

[Pipe]
	maxPipesAtOnce = 8

[Vent]
	"whereAreTheSettings?" = ["I've read the hint and understood"]

[Pump]
	powerSource = "REDSTONE"

	[Pump.ForgeEnergy]
		capacity = 10000
		consumption = 50

	[Pump.KineticEnergy]
		minActivationSpeed = 16
