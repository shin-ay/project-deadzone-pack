# PROJECT DEADZONE full-load evaluation profile for Combined Arms 0.1.4a.
# Enable all requested automatic content except shelling. AI chunk tickets stay
# disabled so aircraft and artillery cannot keep unloaded terrain active.

[events]
	planesInEvents = true
	convoyEventsEnabled = true
	largeCombatEventsEnabled = true
	navalEventsEnabled = true
	invasionEventsEnabled = true
	shellingEventsEnabled = false
	derelictEventsEnabled = true
	overflightEventsEnabled = true
	garrisonVehiclesEnabled = true

[structure_vehicles]
	structureVehiclesEnabled = true

[flight_ai]
	# Keep autonomous helicopters outside the immediate survivor-camp footprint
	# while preserving their ability to acquire and engage nearby threats.
	heliEngageRadius = 64.0
	heliMinStandoff = 72.0
	heliChunkLoading = false
	planeChunkLoading = false

[mortar_ai]
	mortarChunkLoading = false
	artilleryChunkLoading = false
