	#Entities that Mine and Slash damage should never apply to. They take plain vanilla damage instead, and are ignored by spell targeting, projectiles and summons. Blacklist uses entity IDs, not their display names.
	MNS_DAMAGE_ENTITY_BLACKLIST = ["minecraft:villager", "minecraft:wandering_trader"]

	#Minimum player level for each league mechanic to be eligible as bonus content inside a dungeon map.
	#Lets mapping itself start early while league mechanics (Harvest, Obelisks, Prophecy, Shrines, Strongbox, Imprisoned Monster) only start showing up once the player is higher level, so new players aren't overwhelmed.
	#This only gates them spawning inside maps - regular Harvest/Obelisk blocks in the overworld, and Harvest/Obelisk maps themselves, are unaffected and remain available at any level.
	[general.league_mechanic_min_level_in_maps]
		#Range: > 0
		harvest = 60
		#Range: > 0
		obelisk = 60
		#Range: > 0
		prophecy = 60
		#Range: > 0
		shrine = 60
		#Range: > 0
		strongbox = 60
		#Range: > 0
		imprisoned_monster = 60

