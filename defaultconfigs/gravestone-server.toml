# PROJECT DEADZONE grave safety defaults
# A grave may replace a nearby block when no free placement cell exists.
# This prevents inventories from becoming inaccessible in dense ruins,
# vehicles, foliage, roofs, water edges, and revive/death edge cases.
enable_obituary = true
replaceable_blocks = ["#gravestone:grave_replaceable"]
remove_obituary = false
only_owners_can_break = false
spawn_ghost = false
friendly_ghost = true
sneak_pickup = false
break_pickup = true
strict_placement = true
