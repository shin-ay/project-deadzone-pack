# PROJECT DEADZONE: Mine and Slash is the single authority for player and mob
# HP/damage progression. Scaling Health stays installed for compatibility, but
# its parallel difficulty, crystals, blights and multipliers are disabled.
[features]
	crystalsAddHealth = false
	xpAddHealth = false
	crystalsRegenHealth = false
	crystalsAddPetHealth = false
	crystalsAddDamage = false
	hpCrystalsOreGen = false
	powerCrystalsOreGen = false
	mobHpIncrease = false
	mobDamageIncrease = false
	playerDamageScaling = false
	mobDamageScaling = false
	enableDifficulty = false
	enableBlights = false

[debug]
	masterSwitch = false
	showOverlay = false
	logEntitySpawns = false
	logApplyingMobPotions = false
	logDamageScaling = false
